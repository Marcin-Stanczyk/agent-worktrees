# The suite exists because manual testing missed a command that had never once
# worked. Running it on both platforms matters for the same reason: the bug that
# mattered most was a bash-3.2-and-pipefail interaction, and macOS is where that
# bash lives.
name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: git version (needs 2.38+ for merge-tree --write-tree)
        run: git --version

      # zsh is not preinstalled on the Linux runner, and skipping the zsh
      # checks there would defeat the point: the shell function exists in one
      # copy precisely so that bash and zsh cannot drift apart, and the bug it
      # replaced was a zsh-only construct that bash refused to parse.
      # ONE VERSION OF THE GATE, ON BOTH RUNNERS AND ON THE AUTHOR'S MACHINE.
      # This used to be `apt-get install shellcheck` on Linux and `brew` on
      # macOS, which is two different versions of the same check. apt ships
      # 0.9.0; brew and the development machine had 0.11.0. The result: a
      # warning that failed the Linux job passed on macOS and passed locally, so
      # "shellcheck clean" before a push meant nothing and the pipeline went red
      # on something that could not be reproduced anywhere it was written.
      #
      # Exactly the failure the shell function had — one gate, two copies,
      # silently different — so it gets the same answer: one pinned copy.
      # Install the same version locally and CI holds no surprises:
      #   shellcheck --version   # must say 0.11.0
      - name: shellcheck (pinned) and zsh
        run: |
          SC_VERSION=v0.11.0
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq zsh xz-utils
            SC_ASSET="shellcheck-$SC_VERSION.linux.$(uname -m).tar.xz"
          else
            case "$(uname -m)" in
              arm64|aarch64) SC_ASSET="shellcheck-$SC_VERSION.darwin.aarch64.tar.xz" ;;
              *)             SC_ASSET="shellcheck-$SC_VERSION.darwin.x86_64.tar.xz" ;;
            esac
          fi
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/$SC_VERSION/$SC_ASSET" | tar -xJ
          SC="$PWD/shellcheck-$SC_VERSION/shellcheck"
          "$SC" --version
          "$SC" -s bash -e SC2001,SC2016 agent-worktrees.sh install.sh test/run.sh
          # -e SC3043: `local` is the one non-POSIX construct used, on purpose —
          # bash, zsh, dash and ksh all have it, and the alternative is leaking
          # variables into the user's interactive shell.
          "$SC" -s sh -e SC3043 awt.sh
          bash -n awt.sh
          zsh  -n awt.sh

      - name: test suite
        run: ./test/run.sh

      - name: test suite under the system bash (3.2 on macOS)
        run: BASH_UNDER_TEST=/bin/bash ./test/run.sh
